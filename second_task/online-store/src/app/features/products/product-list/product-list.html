<section class="page">
  <header class="header">
    <h1>Online Store</h1>
    <p>Каталог товаров (Kaspi.kz links) — {{ products.length }} позиций</p>
  </header>

  <div class="grid">
    <app-product-card
      *ngFor="let p of products; trackBy: trackById"
      [product]="p"
    ></app-product-card>
  </div>
</section>
