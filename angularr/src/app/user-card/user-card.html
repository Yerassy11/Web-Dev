<div class="card" [class.inactive]="!user.isActive">
  <h3 (click)="onSelect()" style="cursor: pointer;">
    {{ user.name }}
  </h3>

  <p *ngIf="showEmail">{{ user.email }}</p>

  <div class="actions">
    <button type="button" (click)="onToggleActive()">
      {{ user.isActive ? 'Deactivate' : 'Activate' }}
    </button>

    <button type="button" (click)="onDelete()">Delete</button>
  </div>
</div>
